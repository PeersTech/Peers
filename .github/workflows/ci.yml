name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Create frontend dist (for tauri generate_context)
        run: mkdir -p frontend/dist && printf '<html><body>ci</body></html>' > frontend/dist/index.html
        shell: bash
      - name: Format
        run: cargo fmt --check
        working-directory: backend
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: backend
      - name: Test
        run: cargo test
        working-directory: backend

  check:
    name: check (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Create frontend dist (for tauri generate_context)
        run: mkdir -p frontend/dist && printf '<html><body>ci</body></html>' > frontend/dist/index.html
        shell: bash
      - name: Check
        run: cargo check --all-targets
        working-directory: backend
