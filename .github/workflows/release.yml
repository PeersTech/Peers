name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --mac
          - platform: ubuntu-22.04
            args: --linux
          - platform: windows-latest
            args: --win
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci

      - name: Build renderer
        run: npm run build
        working-directory: frontend

      - name: Bundle desktop app (electron-builder)
        run: npx electron-builder ${MATRIX_ARGS}
        working-directory: apps/desktop
        env:
          MATRIX_ARGS: ${{ matrix.args }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
