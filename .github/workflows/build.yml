name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: backend

      - name: Upload Linux .deb
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: peers-linux-deb
          path: backend/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux .rpm
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: peers-linux-rpm
          path: backend/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: peers-linux-appimage
          path: backend/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows .msi
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: peers-windows-msi
          path: backend/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows setup .exe
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: peers-windows-setup
          path: backend/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS .dmg
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: peers-macos-dmg
          path: backend/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
