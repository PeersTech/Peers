[package]
name = "peers-tauri"
version = "0.1.0"
description = "Peers — Tauri shell (small builds, system webview)"
authors = ["Peers"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `tauri build` passes this; embeds frontendDist instead of loading devUrl
custom-protocol = ["tauri/custom-protocol"]
